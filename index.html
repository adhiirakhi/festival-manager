            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;

            color: #111;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }


        .container {

            width: 100%;

            max-width: 480px;

            background:
                rgba(255, 255, 255, 0.78);

            backdrop-filter: blur(25px);

            -webkit-backdrop-filter: blur(25px);

            border:
                1px solid
                rgba(255, 255, 255, 0.7);

            border-radius: 28px;

            padding: 28px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.12);

        }


        .header {

            text-align: center;

            margin-bottom: 35px;

        }


        .header h1 {

            font-size: 36px;

            font-weight: 700;

            letter-spacing: -1px;

        }


        .header p {

            margin-top: 10px;

            color: #666;

            font-size: 15px;

        }


        /* =====================================
           HOME PAGE
        ====================================== */

        #homePage {

            display: block;

        }


        .home-card {

            text-align: center;

            padding: 25px 10px;

        }


        .home-card h2 {

            font-size: 28px;

            margin-bottom: 12px;

        }


        .home-card p {

            color: #666;

            margin-bottom: 30px;

        }


        .primary-btn {

            width: 100%;

            border: none;

            padding: 17px;

            border-radius: 16px;

            background: #111;

            color: white;

            font-size: 17px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;

        }


        .primary-btn:hover {

            transform: translateY(-2px);

            opacity: 0.9;

        }


        /* =====================================
           FESTIVAL SELECTION
        ====================================== */

        #festivalPage {

            display: none;

        }


        .page-title {

            text-align: center;

            font-size: 28px;

            margin-bottom: 10px;

        }


        .page-subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 30px;

        }


        .festival-options {

            display: flex;

            flex-direction: column;

            gap: 15px;

        }


        .festival-option {

            width: 100%;

            padding: 22px;

            border-radius: 20px;

            border:
                1px solid
                #e5e5e5;

            background: white;

            cursor: pointer;

            text-align: left;

            transition: 0.2s;

        }


        .festival-option:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(0, 0, 0, 0.08);

        }


        .festival-option strong {

            display: block;

            font-size: 20px;

            margin-bottom: 5px;

        }


        .festival-option span {

            color: #777;

            font-size: 14px;

        }


        /* =====================================
           ADD PAGE
        ====================================== */

        #addPage {

            display: none;

        }


        .selected-festival {

            text-align: center;

            margin-bottom: 30px;

        }


        .selected-festival .badge {

            display: inline-block;

            padding: 8px 15px;

            background: #111;

            color: white;

            border-radius: 30px;

            font-size: 13px;

            font-weight: 600;

        }


        .form-group {

            margin-bottom: 25px;

        }


        .label {

            display: block;

            font-weight: 600;

            margin-bottom: 10px;

            font-size: 15px;

        }


        .malayalam {

            color: #777;

            font-weight: 400;

        }


        input[type="text"],
        input[type="date"] {

            width: 100%;

            padding: 15px;

            border:
                1px solid
                #ddd;

            border-radius: 14px;

            font-size: 16px;

            outline: none;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.9
                );

        }


        input:focus {

            border-color: #111;

        }


        .date-list {

            display: flex;

            flex-direction: column;

            gap: 10px;

        }


        .date-row {

            display: flex;

            gap: 10px;

            align-items: center;

        }


        .date-row input {

            flex: 1;

        }


        .remove-btn {

            width: 48px;

            height: 48px;

            border: none;

            border-radius: 14px;

            background: #f1f1f1;

            color: #555;

            font-size: 25px;

            cursor: pointer;

        }


        .remove-btn:hover {

            background: #e5e5e5;

        }


        .add-date-btn {

            width: 100%;

            margin-top: 12px;

            padding: 13px;

            border:
                1px dashed
                #aaa;

            border-radius: 14px;

            background: transparent;

            cursor: pointer;

            font-size: 14px;

            font-weight: 600;

        }


        .actions {

            display: flex;

            gap: 12px;

            margin-top: 30px;

        }


        .cancel-btn,
        .save-btn {

            flex: 1;

            padding: 15px;

            border: none;

            border-radius: 15px;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

        }


        .cancel-btn {

            background: #eee;

            color: #222;

        }


        .save-btn {

            background: #111;

            color: white;

        }


        .loading {

            display: none;

            text-align: center;

            margin-top: 20px;

            color: #666;

        }


        .message {

            display: none;

            margin-top: 20px;

            padding: 14px;

            border-radius: 14px;

            text-align: center;

            font-size: 14px;

        }


        .message.success {

            display: block;

            background: #e9f8ed;

            color: #237a3b;

        }


        .message.error {

            display: block;

            background: #fdeaea;

            color: #a22;

        }


        /* =====================================
           MOBILE
        ====================================== */

        @media (max-width: 600px) {

            body {

                padding: 12px;

            }


            .container {

                padding: 20px 16px;

                border-radius: 22px;

            }


            .header h1 {

                font-size: 30px;

            }


            .home-card h2 {

                font-size: 24px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =====================================
         HEADER
    ====================================== -->

    <div class="header">

        <h1>പൂരവും പെരുന്നാളും</h1>

        <p>
            &#x20;
        </p>

    </div>


    <!-- =====================================
         HOME PAGE
    ====================================== -->

    <div id="homePage">

        <div class="home-card">

            <h2>

            <p>

            </p>


            <button

    </div>


    <!-- =====================================

    <div id="festivalPage">

        <h2 class="page-title">

        <p class="page-subtitle">
            Choose the type of festival
        </p>


        <div class="festival-options">


            <!-- POORAM -->

            <button
                class="festival-option"
                onclick="selectFestival('pooram')"
            >

                <strong>
                    POORAM / പൂരം
                </strong>

                <span>
                    Add a specific Pooram name and dates
                </span>

            </button>


            <!-- PERUNNAL -->

            <button
                class="festival-option"
                onclick="selectFestival('perunnal')"
            >

                <strong>
                    PERUNNAL / പെരുന്നാൾ
                </strong>

                <span>
                    Add a specific Perunnal name and dates
                </span>

            </button>


            <!-- OTHER -->

            <button
                class="festival-option"
                onclick="selectFestival('other')"
            >

                <strong>
                    OTHER / മറ്റുള്ളവ
                </strong>

                <span>
                    Add any other festival
                </span>

            </button>


        </div>


        <div class="actions">

            <button
                class="cancel-btn"
                onclick="goHome()"
            >
                CANCEL
            </button>

        </div>

    </div>


    <!-- =====================================
         ADD FESTIVAL PAGE
    ====================================== -->

    <div id="addPage">


        <div class="selected-festival">

            <span
                id="selectedFestivalBadge"
                class="badge"
            >
                POORAM
            </span>

        </div>


        <!-- FESTIVAL NAME -->

        <div class="form-group">

            <label class="label">

                <span id="festivalNameLabel">
                    POORAM NAME
                </span>

                <span
                    class="malayalam"
                    id="festivalNameMalayalam"
                >
                    / പൂരം പേര്
                </span>

            </label>


            <input
                type="text"
                id="festivalName"
                placeholder="Enter Pooram name"
                autocomplete="off"
            >

        </div>


        <!-- DATES -->

        <div class="form-group">

            <label class="label">

                DATE

                <span class="malayalam">
                    / തീയതി
                </span>

            </label>


            <div
                id="dateList"
                class="date-list"
            >

                <div class="date-row">

                    <input
                        type="date"
                        class="festival-date"
                    >

                </div>

            </div>


            <button
                type="button"
                class="add-date-btn"
                onclick="addDate()"
            >

                ＋ ADD MORE DATES /
                കൂടുതൽ തീയതികൾ ചേർക്കുക

            </button>

        </div>


        <!-- ACTION BUTTONS -->

        <div class="actions">

            <button
                class="cancel-btn"
                onclick="backToFestivalSelection()"
            >
                BACK
            </button>


            <button
                class="save-btn"
                onclick="saveFestival()"
            >
                SAVE / ചേർക്കുക
            </button>

        </div>


        <!-- LOADING -->

        <div
            id="loading"
            class="loading"
        >
            Saving festival...
        </div>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        >
        </div>


    </div>


</div>


<script>


/* ==================================================
   GOOGLE APPS SCRIPT URL
================================================== */

const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbyHZSVCf9vOKnWhGIFeEdep0-9ovVP5uTNkeqTUV5MDdJ9dZDyaAvh_JC3le_eK-xBU/exec";


/* ==================================================
   CURRENT FESTIVAL
================================================== */

let selectedFestival = "";


/* ==================================================
   SHOW FESTIVAL SELECTION
================================================== */

function showFestivalPage() {

    document.getElementById("homePage")
        .style.display = "none";

    document.getElementById("festivalPage")
        .style.display = "block";

    document.getElementById("addPage")
        .style.display = "none";

}


/* ==================================================
   SELECT FESTIVAL
================================================== */

function selectFestival(type) {

    selectedFestival = type;


    document.getElementById("homePage")
        .style.display = "none";


    document.getElementById("festivalPage")
        .style.display = "none";


    document.getElementById("addPage")
        .style.display = "block";


    const badge =
        document.getElementById(
            "selectedFestivalBadge"
        );


    const label =
        document.getElementById(
            "festivalNameLabel"
        );


    const malayalam =
        document.getElementById(
            "festivalNameMalayalam"
        );


    const input =
        document.getElementById(
            "festivalName"
        );


    if (type === "pooram") {

        badge.textContent =
            "POORAM / പൂരം";


        label.textContent =
            "POORAM NAME";


        malayalam.textContent =
            "/ പൂരം പേര്";


        input.placeholder =
            "Enter Pooram name";

    }


    else if (type === "perunnal") {

        badge.textContent =
            "PERUNNAL / പെരുന്നാൾ";


        label.textContent =
            "PERUNNAL NAME";


        malayalam.textContent =
            "/ പെരുന്നാൾ പേര്";


        input.placeholder =
            "Enter Perunnal name";

    }


    else if (type === "other") {

        badge.textContent =
            "OTHER / മറ്റുള്ളവ";


        label.textContent =
            "FESTIVAL NAME";


        malayalam.textContent =
            "/ ഉത്സവത്തിന്റെ പേര്";


        input.placeholder =
            "Enter festival name";

    }


    clearFormOnly();

}


/* ==================================================
   ADD DATE
================================================== */

function addDate() {

    const dateList =
        document.getElementById(
            "dateList"
        );


    const row =
        document.createElement("div");


    row.className =
        "date-row";


    row.innerHTML = `

        <input
            type="date"
            class="festival-date"
        >

        <button
            type="button"
            class="remove-btn"
            onclick="removeDate(this)"
            title="Remove date"
        >
            ×
        </button>

    `;


    dateList.appendChild(row);

}


/* ==================================================
   REMOVE DATE
================================================== */

function removeDate(button) {

    const row =
        button.parentElement;


    row.remove();

}


/* ==================================================
   BACK TO FESTIVAL SELECTION
================================================== */

function backToFestivalSelection() {

    clearFormOnly();


    document.getElementById("addPage")
        .style.display = "none";


    document.getElementById("festivalPage")
        .style.display = "block";

}


/* ==================================================
   GO HOME
================================================== */

function goHome() {

    clearFormOnly();


    document.getElementById("festivalPage")
        .style.display = "none";


    document.getElementById("addPage")
        .style.display = "none";


    document.getElementById("homePage")
        .style.display = "block";

}


/* ==================================================
   CLEAR FORM
================================================== */

function clearFormOnly() {

    document.getElementById(
        "festivalName"
    ).value = "";


    document.getElementById(
        "dateList"
    ).innerHTML = `

        <div class="date-row">

            <input
                type="date"
                class="festival-date"
            >

        </div>

    `;


    document.getElementById(
        "message"
    ).style.display = "none";

}


/* ==================================================
   SAVE FESTIVAL
================================================== */

async function saveFestival() {


    const festivalName =
        document
            .getElementById(
                "festivalName"
            )
            .value
            .trim();


    const dateInputs =
        document.querySelectorAll(
            ".festival-date"
        );


    const dates = [];


    dateInputs.forEach(
        function(input) {

            if (input.value) {

                const parts =
                    input.value.split("-");


                const formattedDate =
                    parts[2] +
                    "/" +
                    parts[1] +
                    "/" +
                    parts[0];


                dates.push(
                    formattedDate
                );

            }

        }
    );


    /* ==========================================
       VALIDATION
    ========================================== */


    if (!selectedFestival) {

        showMessage(
            "Please select a festival.",
            "error"
        );

        return;

    }


    if (!festivalName) {

        showMessage(
            "Please enter the festival name.",
            "error"
        );

        return;

    }


    if (dates.length === 0) {

        showMessage(
            "Please select at least one date.",
            "error"
        );

        return;

    }


    /* ==========================================
       LOADING
    ========================================== */

    const loading =
        document.getElementById(
            "loading"
        );


    const saveButton =
        document.querySelector(
            ".save-btn"
        );


    loading.style.display =
        "block";


    saveButton.disabled =
        true;


    saveButton.style.opacity =
        "0.6";


    /* ==========================================
       DATA
    ========================================== */

    const data = {

        festivalType:
            selectedFestival,

        festivalName:
            festivalName,

        dates:
            dates

    };


    console.log(
        "Sending data:",
        data
    );


    /* ==========================================
       SEND TO GOOGLE APPS SCRIPT
    ========================================== */

    try {

        await fetch(

            SCRIPT_URL,

            {

                method: "POST",

                mode: "no-cors",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify(data)

            }

        );


        /*
         IMPORTANT:

         Existing Google Sheet data is never
         replaced by this HTML.

         Every submitted date is sent to
         Google Apps Script, where it is
         appended to the correct month.
        */


        showMessage(
            "Festival saved successfully! 🎉",
            "success"
        );


        setTimeout(
            function() {

                clearFormOnly();


                document.getElementById(
                    "addPage"
                ).style.display =
                    "none";


                document.getElementById(
                    "homePage"
                ).style.display =
                    "block";


            },
            1200
        );


    }


    catch (error) {

        console.error(
            "Save error:",
            error
        );


        showMessage(
            "Something went wrong. Please try again.",
            "error"
        );

    }


    /* ==========================================
       RESET
    ========================================== */

    loading.style.display =
        "none";


    saveButton.disabled =
        false;


    saveButton.style.opacity =
        "1";

}


/* ==================================================
   MESSAGE
================================================== */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        "message " + type;


    message.style.display =
        "block";

}

</script>


</body>

</html>
